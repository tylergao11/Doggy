  <line x1="115" y1="135" x2="350" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="350" y1="135" x2="350" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="585" y1="135" x2="350" y2="175" stroke="#94a3b8" stroke-width="1.5"/>

  <rect class="core" x="230" y="175" width="240" height="50"/>
