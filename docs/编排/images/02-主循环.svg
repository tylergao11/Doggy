<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .b { fill:#f8fafc; stroke:#334155; stroke-width:1.5; rx:12; }
    .hi { fill:#e0f2fe; stroke:#0369a1; stroke-width:1.5; rx:12; }
    .ok { fill:#dcfce7; stroke:#15803d; stroke-width:1.5; rx:12; }
    .warn { fill:#fef3c7; stroke:#b45309; stroke-width:1.5; rx:12; }
    .t { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size:14px; fill:#0f172a; text-anchor:middle; font-weight:600; }
    .s { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size:12px; fill:#475569; text-anchor:middle; }
    .note { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size:12px; fill:#64748b; }
  </style>

  <rect class="b" x="250" y="20" width="180" height="50"/>
  <text class="t" x="340" y="42">用户提交 Prompt</text>
  <text class="s" x="340" y="58">可排队 / 可打断</text>

  <line x1="340" y1="70" x2="340" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect class="hi" x="250" y="100" width="180" height="50"/>
  <text class="t" x="340" y="122">① 模型思考 sample</text>
  <text class="s" x="340" y="138">看对话 + 工具列表</text>

  <line x1="340" y1="150" x2="340" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect class="warn" x="230" y="180" width="220" height="50"/>
  <text class="t" x="340" y="202">② 有 tool_calls？</text>
  <text class="s" x="340" y="218">要不要动手干活</text>

  <!-- yes left -->
  <line x1="230" y1="205" x2="120" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect class="b" x="20" y="180" width="100" height="50"/>
  <text class="t" x="70" y="202">有 → 执行工具</text>
  <text class="s" x="70" y="218">再写回结果</text>
  <path d="M70 180 L70 125 L250 125" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#a)"/>
  <text class="note" x="90" y="115">回到 ① 继续想</text>

  <!-- no down -->
  <line x1="340" y1="230" x2="340" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect class="ok" x="250" y="270" width="180" height="50"/>
  <text class="t" x="340" y="292">③ Turn 结束</text>
  <text class="s" x="340" y="308">回复用户 / 收尾</text>

  <text class="note" x="20" y="345">核心：Turn ≠ 一问一答，而是「想 → 做 → 想」循环，直到不需要工具。</text>
</svg>
